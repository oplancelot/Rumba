# Rumba Backup Tool Configuration
# Copy this file to config.toml and customize for your environment

[source]
# SMB share URL to backup from
url = "\\\\server\\share\\path"

# SMB authentication
username = "backup_user"

# Password (can be plain text or base64 encoded with "base64:" prefix)
# Use: rumba encode-password "your_password" to generate encoded password
password = "your_password_here"

# Glob patterns to exclude from backup
excludes = [
    "**/*.tmp",
    "**/*.cache",
    "**/Thumbs.db",
]


[target]
# Target configuration for backup
# This section is optional for streaming mode (used with PowerShell scripts)

# Output mode: "stream" or "tar"
# - "stream": outputs to stdout for piping to rustltfs or other tools
# - "tar": writes directly to a tar file
output_mode = "stream"

# Path to tar file (only used when output_mode = "tar")
# Supports strftime date formatting:
#   %Y = year (2025), %m = month (01-12), %d = day (01-31)
#   %H = hour (00-23), %M = minute (00-59), %S = second (00-59)
# Example: "backups/backup_%Y%m%d_%H%M%S.tar" -> "backups/backup_20251125_143000.tar"
tar_path = "backup_%Y%m%d_%H%M%S.tar"

# Path to metadata database
db_path = "rumba.db"


[backup]
# Number of parallel scanning threads (default: number of CPU cores)
# parallel_threads = 4

# Zstd compression level (0-22, higher = better compression but slower)
# compression_level = 3

[tape]
# Tape device configuration (for PowerShell streaming scripts)

# Tape device path
# Windows: "\\\\.\\TAPE0"
# Linux: "/dev/sg0"
device = "\\\\.\\TAPE0"

# Path to rumba executable (for PowerShell scripts)
# Default: "rumba" (looks in PATH)
rumba_path = "rumba"

# Skip database backup in streaming mode
skip_database = true

